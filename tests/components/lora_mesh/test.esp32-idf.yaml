substitutions:
  cs_pin: GPIO12
  rst_pin: GPIO13
  busy_pin: GPIO25
  dio1_pin: GPIO26

packages:
  spi: !include ../../test_build_components/common/spi/esp32-idf.yaml

sx126x:
  id: test_radio
  dio1_pin: ${dio1_pin}
  cs_pin: ${cs_pin}
  busy_pin: ${busy_pin}
  rst_pin: ${rst_pin}
  pa_power: 3
  bandwidth: 125_0kHz
  crc_enable: false
  frequency: 433920000
  modulation: LORA
  rx_start: true
  hw_version: sx1262
  spreading_factor: 7
  coding_rate: CR_4_6
  rf_switch: false

<<: !include common.yaml
