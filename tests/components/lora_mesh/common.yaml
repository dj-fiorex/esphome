# common.yaml — lora_mesh component-only config (no bus definitions).
# The radio component is provided via the test's own includes.
#
# Tests:
#  - Normal node: receives messages, sends unicast and broadcast
#  - on_message automation
#  - on_route_update automation
#  - Actions: lora_mesh.send, lora_mesh.broadcast, lora_mesh.send_to_gateway,
#    and templatable lora_mesh.set_upstream_connected

lora_mesh:
  id: mesh
  radio_id: test_radio
  node_id: !lambda 'return std::string("test-001");'
  # Deterministic test-only key; production configurations should use !secret.
  fabric_key: "00000000000000000000000000000000"
  max_hops: 8
  discovery_interval: 30s
  route_ttl: 90s
  max_routes: 16
  seen_cache_size: 32
  seen_cache_ttl: 2min
  forward_messages: true
  tx_jitter: 100ms
  tx_queue_size: 8

  on_message:
    then:
      - lambda: |-
          ESP_LOGI("mesh", "From %s: %.*s", x.source, static_cast<int>(x.payload.size()),
                   reinterpret_cast<const char *>(x.payload.data()));

  on_route_update:
    then:
      - lambda: 'ESP_LOGI("mesh", "Routing table changed, nodes: %zu", id(mesh).get_known_node_count());'

button:
  - platform: template
    name: "Send unicast"
    on_press:
      - lora_mesh.send:
          id: mesh
          destination: "node-002"
          payload: "hello"

  - platform: template
    name: "Broadcast"
    on_press:
      - lora_mesh.broadcast:
          id: mesh
          payload: "hello all"

  - platform: template
    name: "Send to gateway"
    on_press:
      - lora_mesh.send_to_gateway:
          id: mesh
          payload: "sensor_data"

  - platform: template
    name: "Send lambda payload"
    on_press:
      - lora_mesh.send_to_gateway:
          id: mesh
          payload: !lambda 'return std::string("value=42");'

  - platform: template
    name: "Set templated upstream state"
    on_press:
      - lora_mesh.set_upstream_connected:
          id: mesh
          connected: !lambda "return !id(mesh).is_upstream_connected();"
