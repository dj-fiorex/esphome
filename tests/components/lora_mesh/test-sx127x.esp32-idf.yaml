substitutions:
  cs_pin: GPIO12
  rst_pin: GPIO13
  dio0_pin: GPIO26

packages:
  spi: !include ../../test_build_components/common/spi/esp32-idf.yaml

sx127x:
  id: test_radio
  cs_pin: ${cs_pin}
  rst_pin: ${rst_pin}
  dio0_pin: ${dio0_pin}
  pa_pin: BOOST
  pa_power: 17
  bandwidth: 125_0kHz
  coding_rate: CR_4_6
  crc_enable: true
  frequency: 433920000
  modulation: LORA
  packet_mode: true
  preamble_size: 8
  rx_start: true
  spreading_factor: 7

<<: !include common.yaml
